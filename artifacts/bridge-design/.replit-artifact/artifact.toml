kind = "web"
previewPath = "/"
title = "BridgeDesign Pro"
version = "1.0.0"
id = "artifacts/bridge-design"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18825

[services.development]
run = "pnpm --filter @workspace/bridge-design run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bridge-design", "run", "build" ]
publicDir = "artifacts/bridge-design/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18825"
BASE_PATH = "/"
